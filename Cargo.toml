[package]
name = "qubit-codec-text"
version = "0.4.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-codec-text"
description = "Buffer-oriented text encoding and decoding utilities for Rust"
homepage = "https://github.com/qubit-ltd/rs-codec-text"
documentation = "https://docs.rs/qubit-codec-text"
readme = "README.md"
keywords = ["text", "encoding", "codec", "unicode", "utf8"]
categories = ["encoding", "text-processing"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/src/**",
    "/doc/**",
    "/tests/**",
    "/benches/**",
]

[lib]
name = "qubit_codec_text"
doctest = true

[package.metadata.rs-ci]
miri = true
sanitizers = ["address"]

[[test]]
name = "error"
path = "tests/error/mod.rs"

[[test]]
name = "codec"
path = "tests/codec/mod.rs"

[[test]]
name = "convert"
path = "tests/convert/mod.rs"

[[test]]
name = "decode"
path = "tests/decode/mod.rs"

[[test]]
name = "encode"
path = "tests/encode/mod.rs"

[[test]]
name = "charset"
path = "tests/charset/mod.rs"

[dependencies]
thiserror = "2.0"
qubit-utils = "0.2"
qubit-codec = { path = "../rs-codec", version = "0.12" }
serde = { version = "1.0", optional = true }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
proptest = "1.11"
serde_json = "1.0"

[[bench]]
name = "transcode"
harness = false

[features]
default = []
serde = ["dep:serde"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
