[package]
name = "qubit-codec-text-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
qubit-codec = "0.13"
qubit-codec-text = { path = ".." }

[[bin]]
name = "utf8_decode"
path = "fuzz_targets/utf8_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "utf16_decode"
path = "fuzz_targets/utf16_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "utf32_decode"
path = "fuzz_targets/utf32_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "utf8_chunked_decode"
path = "fuzz_targets/utf8_chunked_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "utf8_encode"
path = "fuzz_targets/utf8_encode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "utf8_to_utf16_convert"
path = "fuzz_targets/utf8_to_utf16_convert.rs"
test = false
doc = false
bench = false
